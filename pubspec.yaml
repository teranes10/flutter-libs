name: flutter_libs
description: Monorepo for shared packages and apps
publish_to: "none"
repository: https://github.com/teranes10/flutter-libs
environment:
  sdk: ^3.6.0

workspace:
  - packages/te_editor
  - packages/te_map
  - packages/te_scanner
  - packages/te_widgets
  - apps/my_app

dev_dependencies:
  melos: ^8.10.1
  flutter_lints: ^6.0.0

melos:
  command:
    version:
      linkToCommits: true
      updateGitTagRefs: true
      includeCommitId: true

  scripts:
    check:
      run: |
        dart format --output=none --set-exit-if-changed packages apps &&
        dart run melos exec -c 1 -- flutter analyze --fatal-infos &&
        dart run melos exec -c 1 --dir-exists=test -- flutter test
      description: Format check + analyze + tests (run by CI).

    format:
      run: dart run melos exec -- dart format .
      description: Format all Dart files across the workspace.

    changelog:
      run: dart run melos version --no-git-tag-version --yes
      description: Generate changelogs and update versions without tagging.

    commit:
      run: |
        git add .
        git commit -m "chore(release): update versions and changelogs"
      description: Commit the newly generated changelogs and version bumps.

    release:
      run: dart run melos version --yes
      description: Automatically version, generate changelogs, commit, and tag releases.

    publish:
      run: dart run melos publish --no-dry-run --yes
      description: Publish te_widgets, te_map, te_editor, te_scanner to pub.dev (ignores my_app since it has publish_to none).

    deploy:
      run: |
        git add .
        git commit -m "fix: automated deployment and release" || true
        dart run melos run release
        dart run melos run publish
        git push --follow-tags
      description: All-in-one command to commit, release, publish, and push tags.