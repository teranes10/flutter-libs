name: flutter_libs

packages:
  - packages/**
  - apps/**

commands:
  version:
    linkToCommits: true
    updateGitTagRefs: true
    includeCommitId: true

scripts:
  format:
    run: melos exec -- dart format .
    description: Format all Dart files across the workspace.

  changelog:
    run: melos version --no-git-tag-version --yes
    description: Generate changelogs and update versions without tagging.

  commit:
    run: |
      git add .
      git commit -m "chore(release): update versions and changelogs"
    description: Commit the newly generated changelogs and version bumps.

  release:
    run: melos version --yes
    description: Automatically version, generate changelogs, commit, and tag releases.

  publish:
    run: melos publish --no-dry-run --yes
    description: Publish te_widgets, te_map, te_editor, te_scanner to pub.dev (ignores my_app since it has publish_to none).