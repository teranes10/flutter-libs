name: te_widgets
description: "Te Flutter Widgets"
version: 4.1.0


homepage: https://teranes10.github.io/flutter-libs/myapp
repository: https://github.com/teranes10/flutter-libs/tree/master/packages/te_widgets

resolution: workspace
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.1.2
  intl: ^0.20.2
  pdf: ^3.11.3
  file_saver: ^0.7.0
  file_picker: ^13.3.3
  image_picker: ^1.2.4
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  calendar_date_picker2: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.5.0
  path_provider: ^2.1.6
  http: ^1.2.0
  hugeicons: ^4.4.0
  archive: ^4.6.0
  desktop_drop: ^0.8.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  cross_file: ^0.3.4
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/no_image.png
    - assets/icons/profile.png
    
  fonts:
    - family: Lexend
      fonts:
        - asset: fonts/Lexend-Light.ttf
          weight: 300
        - asset: fonts/Lexend-Regular.ttf
          weight: 400
        - asset: fonts/Lexend-Medium.ttf
          weight: 500
        - asset: fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: fonts/Lexend-Bold.ttf
          weight: 700
